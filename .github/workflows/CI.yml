name: ETMP CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: Icxn3747
          POSTGRES_DB: etmp_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U etmp_user -d etmp_test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_NAME: ETMP
      APP_ENV: development
      DEBUG: "false"
      API_V1_PREFIX: /api/v1
      DATABASE_URL: postgresql+asyncpg://postgres:Icxn3747@localhost:5432/etmp_db
      JWT_SECRET_KEY: supersecretkey12345678901234567890
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"
      CORS_ORIGINS: http://localhost:5173

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Apply Alembic migrations against CI database
        run: python -m alembic upgrade head

      - name: Check Alembic migration graph has a single head
        run: python -m alembic heads

      - name: Seed RBAC permissions/roles
        run: python -m app.db.seed
