{% extends "base.html" %}
{% block title %}Teams - ETMP{% endblock %}
{% block content %}
<a href="/organizations/{{ organization_id }}" class="back-link">← Organization</a>
<h2>Teams</h2>

<ul>
    {% for team in teams %}
    <li>
        <a href="/organizations/{{ organization_id }}/teams/{{ team.id }}">{{ team.name }}</a>
    </li>
    {% else %}
    <li>No teams yet.</li>
    {% endfor %}
</ul>

<h3>Create New Team</h3>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="POST" action="/organizations/{{ organization_id }}/teams">
    <label>Name:</label>
    <input type="text" name="name" required>
    <button type="submit">Create</button>
</form>
{% endblock %}
